<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chef Edilson · Cardápio</title>
  <meta name="description" content="O cardápio da casa: massas, carnes, peixes, risotos e muito mais, feitos pelo Chef Edilson.">
  <meta name="theme-color" content="#f7f0e4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1714" media="(prefers-color-scheme: dark)">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="capa">
    <div class="capa-texto">
      <p class="sobretitulo">Cardápio da casa</p>
      <h1>Chef Edilson</h1>
      <p class="assinatura">Feito em casa, servido com carinho. Escolha com calma: a cozinha é sua.</p>
    </div>
    <img class="capa-foto" src="fotos/salmao-abobora-2.jpg" alt="Chef de dólmã branco segurando um prato de salmão com purê de abóbora e legumes" width="1200" height="1600">
  </header>

  <nav class="grupos" id="grupos" aria-label="Grupos do cardápio"></nav>

  <main id="cardapio">
    <noscript><p class="aviso">Ative o JavaScript para ver o cardápio.</p></noscript>
  </main>

  <footer class="rodape">
    <p>Reservas com o chef. Mesa para dois sempre disponível.</p>
  </footer>

  <dialog class="detalhe" id="detalhe" aria-labelledby="detalhe-nome">
    <div class="detalhe-corpo">
      <button class="fechar" id="fechar" type="button" aria-label="Fechar">&times;</button>
      <img class="detalhe-foto" id="detalhe-foto" alt="">
      <div class="detalhe-galeria" id="detalhe-galeria"></div>
      <div class="detalhe-texto">
        <p class="sobretitulo" id="detalhe-grupo"></p>
        <h2 id="detalhe-nome"></h2>
        <p id="detalhe-desc"></p>
      </div>
    </div>
  </dialog>

  <script src="js/pratos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
